# XcodeGen spec — generates WhisperBox.xcodeproj (the real app bundle target).
# Needed because recording (ScreenCaptureKit + mic) requires TCC permissions
# tied to a signed bundle, which a bare SwiftPM executable can't obtain.
#
# Usage:
#   brew install xcodegen      # one-time
#   xcodegen generate          # (re)create WhisperBox.xcodeproj
#   open WhisperBox.xcodeproj  # then Run (⌘R)
#
# The Package.swift stays for offline `swift build` compile-checks; this project
# compiles the same Sources/WhisperBox files into a proper .app.

name: WhisperBox
options:
  bundleIdPrefix: be.squareflow
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"

targets:
  WhisperBox:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisperBox
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.squareflow.whisperbox
        PRODUCT_NAME: WhisperBox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"            # Swift 5 language mode (lenient concurrency)
        GENERATE_INFOPLIST_FILE: YES
        # Mic needs a usage string; screen recording is requested at runtime (no key).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "WhisperBox records the microphone for transcription."
        INFOPLIST_KEY_LSUIElement: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U3TUL63HHK
        COMBINE_HIDPI_IMAGES: YES
        # Hardened Runtime + entitlements — required for notarization (Developer ID).
        # The mic entitlement lives in WhisperBox.entitlements; see build-dmg.sh for
        # the Developer ID signing + notarize/staple flow.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: WhisperBox.entitlements
